[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maillard-backoffice"
version = "0.1.0"
description = "Internal invoice processing system for Maillard"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # PDF & OCR
    "pymupdf>=1.23",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",

    # Data & validation
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dateutil>=2.8",

    # Utilities
    "python-dotenv>=1.0",
    "httpx>=0.25",

    # Dropbox
    "dropbox>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "ruff>=0.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
